name = "bible-study-hub"
type = "javascript"
compatibility_date = "2026-08-02"

[env.production]
routes = [{ pattern = "biblestudyhub.com/*", zone_name = "biblestudyhub.com" }]

[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.{ts,js,astro}"]

[build.upload]
format = "service-worker"
