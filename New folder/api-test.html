<!DOCTYPE html>
<html>
<head>
  <title>Google Gemini API Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    .form-group {
      margin: 15px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #5568d3;
    }
    .result {
      background: #f0f0f0;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
      border-left: 4px solid #ccc;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }
    .result.success {
      background: #d4edda;
      color: #155724;
      border-left-color: #28a745;
      display: block;
    }
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border-left-color: #dc3545;
      display: block;
    }
    .result h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    textarea {
      min-height: 80px;
    }
    .info {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Google Gemini API Test</h1>

    <div class="info">
      <strong>ℹ️ How to use:</strong> Paste your API key, enter a test message, and click "Test API" to verify your key works.
    </div>

    <div class="form-group">
      <label for="apiKey">Google Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Paste your API key here (starts with AIzaSy)">
      <small style="color: #666;">Your key is NOT saved or sent anywhere except to Google's API. It's only used for this test.</small>
    </div>

    <div class="form-group">
      <label for="query">Test Message:</label>
      <textarea id="query" placeholder="Enter a test message">Summarize this Bible verse: John 3:16 - For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.</textarea>
    </div>

    <button onclick="testAPI()">Test API</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function testAPI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const query = document.getElementById('query').value.trim();
      const resultDiv = document.getElementById('result');

      // Validation
      if (!apiKey) {
        showResult('❌ Please paste your API key', 'error');
        return;
      }

      if (!apiKey.startsWith('AIzaSy')) {
        showResult('❌ API key should start with "AIzaSy". Make sure you copied it correctly from https://aistudio.google.com/apikey', 'error');
        return;
      }

      if (!query) {
        showResult('❌ Please enter a test message', 'error');
        return;
      }

      showResult('⏳ Testing API... Please wait...', '');

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: query }] }]
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          const errorMsg = data.error?.message || response.statusText;

          if (response.status === 401) {
            showResult(`❌ <h3>Invalid API Key</h3>
              <p>The API key you provided is not valid.</p>
              <p><strong>Check:</strong></p>
              <ul>
                <li>Did you copy the full key?</li>
                <li>Is it from <a href="https://aistudio.google.com/apikey" target="_blank">https://aistudio.google.com/apikey</a>?</li>
                <li>Try deleting the old key and creating a new one</li>
              </ul>
              <p style="color: #555;"><em>Error: ${errorMsg}</em></p>`, 'error');
          } else if (response.status === 400) {
            showResult(`❌ <h3>Bad Request</h3>
              <p>There's an issue with the API request.</p>
              <p><strong>Error:</strong> ${errorMsg}</p>
              <p style="color: #555;"><em>Make sure you're using the correct API key format and the message is valid.</em></p>`, 'error');
          } else {
            showResult(`❌ <h3>API Error: ${response.status}</h3>
              <p><strong>Error:</strong> ${errorMsg}</p>
              <p style="color: #555;"><em>Check your API key and internet connection.</em></p>`, 'error');
          }
          return;
        }

        // Check if we have a valid response
        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          showResult('❌ <h3>Unexpected Response</h3><p>The API returned an unexpected response format.</p>', 'error');
          return;
        }

        const responseText = data.candidates[0].content.parts[0].text;

        showResult(`✅ <h3>API Working!</h3>
          <p><strong>✓ Your API key is valid!</strong></p>
          <p><strong>✓ The extension should work!</strong></p>
          <hr>
          <p><strong>API Response:</strong></p>
          <p>${responseText.replace(/\n/g, '<br>')}</p>`, 'success');

      } catch (error) {
        showResult(`❌ <h3>Connection Error</h3>
          <p><strong>Error:</strong> ${error.message}</p>
          <p><strong>Check:</strong></p>
          <ul>
            <li>Is your internet connection working?</li>
            <li>Is Google API accessible from your location?</li>
            <li>Try refreshing this page and testing again</li>
          </ul>`, 'error');
      }
    }

    function showResult(message, type) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = message;
      resultDiv.className = `result ${type}`;
    }

    // Allow Enter to submit
    document.getElementById('query').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        testAPI();
      }
    });
  </script>
</body>
</html>
