 <!DOCTYPE html>
  <html>
  <head>
    <title>List Available Models</title>
    <style>
      body { font-family: Arial; max-width: 600px; margin: 20px auto; }
      textarea { width: 100%; min-height: 100px; padding: 10px; }
      button { padding: 10px 20px; background: #667eea; color: white; border: none; cursor: pointer; }
      .result { background: #f0f0f0; padding: 15px; margin: 20px 0; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>List Available Models</h1>
    <input type="password" id="apiKey" placeholder="Paste your API key" style="width: 100%; padding: 10px;
  margin-bottom: 10px;">
    <button onclick="listModels()">List Models</button>
    <div id="result" class="result" style="display: none;"></div>

    <script>
      async function listModels() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const resultDiv = document.getElementById('result');

        if (!apiKey) {
          resultDiv.innerHTML = '❌ Please paste your API key';
          resultDiv.style.display = 'block';
          return;
        }

        resultDiv.innerHTML = '⏳ Loading models...';
        resultDiv.style.display = 'block';

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`
          );

          const data = await response.json();

          if (!response.ok) {
            resultDiv.innerHTML = `❌ Error: ${data.error?.message || response.statusText}`;
            return;
          }

          if (!data.models || data.models.length === 0) {
            resultDiv.innerHTML = '❌ No models found';
            return;
          }

          let html = '<h3>✅ Available Models:</h3><pre>';
          data.models.forEach(model => {
            html += `\n${model.name}`;
            if (model.displayName) html += ` (${model.displayName})`;
            if (model.description) html += `\n  → ${model.description}`;
          });
          html += '</pre>';

          resultDiv.innerHTML = html;
        } catch (error) {
          resultDiv.innerHTML = `❌ Error: ${error.message}`;
        }
      }
    </script>
  </body>
  </html>
